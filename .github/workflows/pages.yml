name: Deploy Vencord Arabic website

on:
  push:
    branches:
      - main
    paths:
      - "site-vencord/**"
      - "site/install.sh"
      - "assets/vencord-arabic-logo.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Vencord Arabic
        uses: actions/checkout@v6

      - name: Checkout upstream Vencord website
        uses: actions/checkout@v6
        with:
          repository: Vencord/vencord.dev
          ref: 723bda03da6826518272b11f02df1791005c8f97
          path: vencord-site
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup upstream pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Apply Vencord Arabic website overrides
        run: |
          cp assets/vencord-arabic-logo.png vencord-site/public/assets/vencord-arabic-logo.png
          cp site/install.sh vencord-site/public/install.sh
          node site-vencord/apply-overrides.mjs vencord-site
          node site-vencord/localize.mjs vencord-site

      - name: Install upstream website dependencies
        working-directory: vencord-site
        run: pnpm install --frozen-lockfile

      - name: Build upstream Astro/Svelte website
        working-directory: vencord-site
        run: pnpm exec astro build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: vencord-site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
