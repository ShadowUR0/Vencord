name: Arabic Import Autofix Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arabic-import-autofix-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply ESLint autofix
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec eslint src/userplugins/VencordArabic/index.ts --fix
          if git diff --quiet -- src/userplugins/VencordArabic/index.ts; then
            echo "No autofix changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/userplugins/VencordArabic/index.ts
          git commit -m "Fix Arabic plugin import ordering"
          git push origin HEAD:main
