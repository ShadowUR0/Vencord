name: Sync upstream Vencord

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upstream-sync.yml
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-vencord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vencord Arabic
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream Vencord
        run: |
          git remote add upstream https://github.com/Vendicated/Vencord.git
          git fetch upstream main

      - name: Merge upstream when needed
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Vencord Arabic already contains the latest upstream Vencord commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the merge on the runner, preserving fork-owned documentation.
          # Do not automatically resolve conflicts in source code or translations.
          if ! git merge --no-commit --no-ff upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ -z "$conflicts" ]]; then
              echo "::error::Upstream merge failed without resolvable file conflicts."
              exit 1
            fi

            while IFS= read -r file; do
              case "$file" in
                .github/ISSUE_TEMPLATE/bug_report.yml|.github/pull_request_template.md|CODE_OF_CONDUCT.md|CONTRIBUTING.md)
                  echo "Preserving Vencord Arabic documentation: $file"
                  git checkout --ours -- "$file"
                  git add -- "$file"
                  ;;
                *)
                  echo "::error file=$file::Unexpected upstream merge conflict; manual review required."
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          fi

          if [[ -n "$(git ls-files --unmerged)" ]]; then
            echo "::error::Unresolved merge conflicts remain."
            exit 1
          fi

          git commit -m "Merge upstream Vencord into Vencord Arabic"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.merge.outputs.changed == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify Arabic translation review
        if: steps.merge.outputs.changed == 'true'
        run: node scripts/checkArabicTranslations.mjs

      - name: Lint and build desktop
        if: steps.merge.outputs.changed == 'true'
        run: pnpm test

      - name: Build web
        if: steps.merge.outputs.changed == 'true'
        run: pnpm buildWeb

      - name: Validate plugin structure
        if: steps.merge.outputs.changed == 'true'
        run: pnpm generatePluginJson

      - name: Update Vencord Arabic main
        if: steps.merge.outputs.changed == 'true'
        run: |
          # This push targets ShadowUR0/Vencord only. This workflow never
          # creates a pull request, issue or submission in upstream Vencord.
          git push origin HEAD:main

      - name: Publish updated Arabic build
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push made with GITHUB_TOKEN does not trigger push workflows.
          # Explicit workflow_dispatch is required to publish fresh assets.
          gh workflow run arabic-release.yml --repo "$GITHUB_REPOSITORY" --ref main
