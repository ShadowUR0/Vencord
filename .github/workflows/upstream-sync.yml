name: Sync upstream Vencord

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-vencord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vencord Arabic
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream Vencord
        run: |
          git remote add upstream https://github.com/Vendicated/Vencord.git
          git fetch upstream main

      - name: Merge upstream when needed
        id: merge
        shell: bash
        run: |
          set -euo pipefail

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Vencord Arabic already contains the latest upstream Vencord commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Merge only in this temporary runner first. Nothing reaches our
          # main branch until all Vencord and Arabic-fork checks below pass.
          git merge --no-edit upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.merge.outputs.changed == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify Arabic translation review
        if: steps.merge.outputs.changed == 'true'
        run: pnpm checkArabicTranslations

      - name: Lint and build desktop
        if: steps.merge.outputs.changed == 'true'
        run: pnpm test

      - name: Build web
        if: steps.merge.outputs.changed == 'true'
        run: pnpm buildWeb

      - name: Validate plugin structure
        if: steps.merge.outputs.changed == 'true'
        run: pnpm generatePluginJson

      - name: Update Vencord Arabic main
        if: steps.merge.outputs.changed == 'true'
        run: |
          # This push targets ShadowUR0/Vencord only. This workflow never
          # creates a pull request, issue or submission in upstream Vencord.
          git push origin HEAD:main
