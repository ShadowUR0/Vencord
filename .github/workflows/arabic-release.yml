name: Build ڤينكورد العربي DevBuild

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arabic-release.yml
      - src/**
      - browser/**
      - scripts/build/**
      - scripts/checkArabicTranslations.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_COLOR: true

concurrency:
  group: vencord-arabic-devbuild
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Arabic translation coverage
        run: pnpm checkArabicTranslations

      - name: Validate TypeScript and source
        run: |
          pnpm testTsc
          pnpm lint
          pnpm lint-styles

      - name: Build web
        run: pnpm buildWebStandalone

      - name: Build desktop
        run: pnpm build --standalone

      - name: Generate plugin list
        run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

      - name: Clean up obsolete files
        run: |
          rm -rf dist/*-unpacked dist/vendor Vencord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordArabic-DevBuild
          path: dist/

      - name: Publish rolling DevBuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"

          cat > release-notes.md <<EOF
          نسخة التطوير المتجددة من ڤينكورد العربي.

          مبنية على Vencord مع طبقة التعريب المدمجة الخاصة بـ VencordArabic.
          يتم تحديث هذا الاصدار تلقائيا عند تحديث ڤينكورد العربي ويستخدمه ShadowUR0/Installer.

          Source commit: $GITHUB_SHA
          EOF

          if gh release view devbuild >/dev/null 2>&1; then
            gh release edit devbuild \
              --target main \
              --title "ڤينكورد العربي DevBuild $SHORT_SHA" \
              --notes-file release-notes.md
            gh release upload devbuild --clobber dist/*
          else
            gh release create devbuild dist/* \
              --target main \
              --title "ڤينكورد العربي DevBuild $SHORT_SHA" \
              --notes-file release-notes.md
          fi
