name: Build and Publish Windows Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arabic-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest

    env:
      VENCORD_REMOTE: ShadowUR0/Vencord

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone Vencord
        run: pnpm buildStandalone

      - name: Prepare Windows package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}"
              $releaseTag = "${{ github.ref_name }}"
              $releaseTitle = "Vencord Arabic ${{ github.ref_name }}"
          } else {
              $version = "latest"
              $releaseTag = "latest"
              $releaseTitle = "Vencord Arabic - Latest Build"
          }

          $packageName = "VencordArabic-$version-Windows"
          $packageDir = Join-Path $PWD "package"
          $outputDir = Join-Path $PWD "release-output"
          $zipPath = Join-Path $outputDir "$packageName.zip"
          $hashPath = "$zipPath.sha256"

          New-Item -ItemType Directory -Force -Path $packageDir, $outputDir | Out-Null
          Copy-Item -Path "dist" -Destination (Join-Path $packageDir "dist") -Recurse
          Copy-Item -Path "LICENSE" -Destination (Join-Path $packageDir "LICENSE")

          Invoke-WebRequest `
              -Uri "https://github.com/Vencord/Installer/releases/latest/download/VencordInstallerCli.exe" `
              -OutFile (Join-Path $packageDir "VencordInstallerCli.exe")

          @'
          @echo off
          setlocal
          title Install Vencord Arabic
          set "VENCORD_USER_DATA_DIR=%~dp0"
          set "VENCORD_DEV_INSTALL=1"
          "%~dp0VencordInstallerCli.exe" --install
          echo.
          echo Installation finished. You may now open Discord.
          pause
          '@ | Set-Content -Path (Join-Path $packageDir "Install.bat") -Encoding ascii

          @'
          @echo off
          setlocal
          title Uninstall Vencord Arabic
          set "VENCORD_USER_DATA_DIR=%~dp0"
          set "VENCORD_DEV_INSTALL=1"
          "%~dp0VencordInstallerCli.exe" --uninstall
          echo.
          echo Uninstall finished.
          pause
          '@ | Set-Content -Path (Join-Path $packageDir "Uninstall.bat") -Encoding ascii

          $commit = "${{ github.sha }}"
          $sourceUrl = "https://github.com/${{ github.repository }}/tree/$commit"

          @"
          Vencord Arabic for Windows
          ===========================

          التثبيت:
          1. فك ضغط الملف بالكامل.
          2. أغلق Discord بالكامل، بما في ذلك أيقونته بجانب الساعة.
          3. شغّل Install.bat.
          4. افتح Discord وفعّل إضافة VencordArabic من إعدادات Vencord.

          إزالة التثبيت:
          شغّل Uninstall.bat من المجلد نفسه.

          ملاحظات:
          - هذه نسخة غير رسمية مبنية على Vencord وليست صادرة عن فريق Vencord الأصلي أو Discord.
          - قد يعرض Windows تحذير SmartScreen لأن الحزمة غير موقعة رقميًا.
          - لا تحذف مجلد الحزمة قبل إكمال التثبيت.
          - استخدام تعديلات عميل Discord قد يخالف شروط خدمة Discord.

          Source code for this exact build:
          $sourceUrl

          Commit:
          $commit

          License:
          GPL-3.0-or-later. See LICENSE.
          "@ | Set-Content -Path (Join-Path $packageDir "README.txt") -Encoding utf8

          @"
          Repository: https://github.com/${{ github.repository }}
          Commit: $commit
          Build workflow: ${{ github.workflow }}
          "@ | Set-Content -Path (Join-Path $packageDir "BUILD_INFO.txt") -Encoding utf8

          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content -Path $hashPath -Encoding ascii

          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_title=$releaseTitle" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "hash_path=$hashPath" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.hash_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = "${{ steps.package.outputs.release_tag }}"
          $title = "${{ steps.package.outputs.release_title }}"
          $zip = "${{ steps.package.outputs.zip_path }}"
          $hash = "${{ steps.package.outputs.hash_path }}"

          if ($tag -eq "latest") {
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -f latest $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw "Failed to create the latest tag." }
              git push origin refs/tags/latest --force
              if ($LASTEXITCODE -ne 0) { throw "Failed to publish the latest tag." }
          }

          $notes = @"
          Unofficial Windows build of Vencord with the VencordArabic localization plugin included.

          Install: extract the ZIP, close Discord completely, then run Install.bat.

          Verify: compare the ZIP with the included .sha256 file.

          Source commit: $env:GITHUB_SHA
          "@
          $notesPath = Join-Path $PWD "release-notes.md"
          $notes | Set-Content -Path $notesPath -Encoding utf8

          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
              gh release edit $tag --title $title --notes-file $notesPath
              if ($LASTEXITCODE -ne 0) { throw "Failed to update the release." }
              gh release upload $tag $zip $hash --clobber
              if ($LASTEXITCODE -ne 0) { throw "Failed to upload release files." }
          } else {
              gh release create $tag $zip $hash --target $env:GITHUB_SHA --title $title --notes-file $notesPath
              if ($LASTEXITCODE -ne 0) { throw "Failed to create the release." }
          }
