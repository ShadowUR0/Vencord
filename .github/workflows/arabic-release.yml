name: Build and Publish Vencord Arabic Assets

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vencord-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VENCORD_REMOTE: ShadowUR0/Vencord

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop assets
        run: pnpm buildStandalone

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare required assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/patcher.js* release-assets/
          cp dist/preload.js* release-assets/
          cp dist/renderer.js* release-assets/
          cp dist/renderer.css* release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordArabic-Raw-Assets
          path: release-assets/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          if [ "$TAG" = "latest" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f latest "$GITHUB_SHA"
            git push origin refs/tags/latest --force
          fi

          printf 'Unofficial Vencord build with VencordArabic included.\n\nThese raw assets are consumed by ShadowUR0/Installer.\nSource commit: %s\n' "$GITHUB_SHA" > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Vencord Arabic - $TAG" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "Vencord Arabic - $TAG" --notes-file release-notes.md
          fi
