name: Import sort probe

on:
  push:
    branches:
      - maintenance/import-sort-probe-2026-09-04

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Autofix target and print exact diff
        run: |
          pnpm exec eslint src/userplugins/VencordArabic/index.ts --fix
          git diff -- src/userplugins/VencordArabic/index.ts
