name: بلاغ خلل في Vencord Arabic
description: ابلغ عن مشكلة في التعريب او RTL او تكامل نسخة Vencord Arabic
title: "[Bug] <العنوان>"
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        شكرا لابلاغك عن المشكلة

        هذا النموذج خاص بمستودع **Vencord Arabic**. اذا كانت المشكلة موجودة في Vencord الرسمي ايضا فلا باس بذكرها هنا، لكن وضح ذلك كي نستطيع معرفة هل السبب من upstream ام من تعديلاتنا. لن يقوم هذا المشروع بارسال Issue او Pull Request تلقائيا الى Vencord الرسمي.

        للدعم العام او مشاكل التثبيت التي لا تحتاج تغييرا برمجيا استخدم [Discord الخاص بالمشروع](https://discord.gg/D9uwnFnqmd).

  - type: dropdown
    id: area
    attributes:
      label: نوع المشكلة
      options:
        - ترجمة عربية ناقصة او خاطئة
        - RTL او تنسيق واجهة
        - Plugin او اعدادات Vencord داخل النسخة العربية
        - Vencord Arabic Installer
        - تحديث او مزامنة
        - انهيار او خطا برمجي
        - اخرى
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: ماذا يحدث؟
      description: صف المشكلة والصفحة او الـPlugin الذي تظهر فيه
      placeholder: اشرح ما يظهر حاليا وما الخطا فيه
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ما النتيجة المتوقعة؟
      placeholder: اشرح كيف يجب ان يظهر او يعمل الشيء بدلا من ذلك
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: خطوات اعادة المشكلة
      placeholder: |
        1. افتح ...
        2. انتقل الى ...
        3. فعل ...
        4. تظهر المشكلة
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: اصدار او commit Vencord Arabic
      description: اذكر Git hash او معلومات الاصدار ان كانت متاحة في اعدادات Vencord
      placeholder: مثال: abc1234
    validations:
      required: false

  - type: dropdown
    id: discord-channel
    attributes:
      label: نسخة Discord
      options:
        - Stable
        - PTB
        - Canary
        - Vesktop
        - Web
        - اخرى
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: صور او اخطاء او معلومات اضافية
      description: ارفق لقطة شاشة او الصق خطا من Developer Console اذا كان ذلك مفيدا. احذف اي معلومات شخصية قبل الارسال
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: تاكيدات
      options:
        - label: بحثت عن بلاغ مشابه ولم اجد نفس المشكلة
          required: true
        - label: جربت احدث DevBuild من Vencord Arabic او احدث Installer المتاح عندما يكون ذلك مناسبا
          required: true
        - label: لم اضع بيانات حساسة او توكنات او معلومات خاصة في البلاغ
          required: true
