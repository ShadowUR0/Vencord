name: اقتراح لـVencord Arabic
description: اقترح تحسين تعريب او RTL او ميزة خاصة بهذا الـfork
title: "[Feature] <العنوان>"
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        هذا النموذج مخصص للتغييرات الخاصة بـ**Vencord Arabic** مثل تحسين تجربة العربية وRTL وادوات المحافظة على التعريب وتكامل المشروع

        لطلبات Plugins العامة استخدم [Discord الخاص بالمشروع](https://discord.gg/D9uwnFnqmd)

        هذا المستودع لا يفتح Pull Requests او Issues تلقائيا في Vencord الرسمي

  - type: dropdown
    id: area
    attributes:
      label: مجال الاقتراح
      options:
        - التعريب وصياغة النصوص
        - RTL وتجربة الواجهة العربية
        - ادوات التحديث والمزامنة
        - Vencord Arabic Installer
        - توثيق وتجربة المطور
        - ميزة خاصة بالـfork
        - اخرى
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: ما المشكلة التي تريد حلها؟
      description: اشرح الحاجة قبل وصف الحل
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: الحل المقترح
      description: صف النتيجة التي تريدها وكيف تتوقع ان تعمل
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: معلومات اضافية
      description: صور او امثلة او ملاحظات تقنية تساعد على فهم الفكرة
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: تاكيدات
      options:
        - label: بحثت عن اقتراح مشابه ولم اجده
          required: true
        - label: الاقتراح متعلق بـVencord Arabic او تجربة العربية وليس مجرد طلب Plugin عام
          required: true
